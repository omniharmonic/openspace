<!-- title: Contact — Tidewater Studio | description: Start a project. -->
<section class="section contact"><div class="container w-container"><h1>Start a project</h1><p>Tell us a little about what you need.</p>
<div class="w-form"><form id="email-form" name="email-form" data-name="Project enquiry" method="get" aria-label="Project enquiry">
<label for="name">Name</label><input class="w-input" maxlength="256" name="name" id="name" type="text" required>
<label for="email">Email</label><input class="w-input" name="email" id="email" type="email" required>
<label for="budget">Budget</label><select id="budget" name="budget" class="w-select"><option value="">Select one…</option><option value="small">Under £3k</option><option value="large">£3k and up</option></select>
<label for="msg">Message</label><textarea id="msg" name="msg" class="w-input"></textarea>
<label class="w-checkbox"><input type="checkbox" name="newsletter" id="newsletter"><span class="w-form-label" for="newsletter">Send me the occasional newsletter</span></label>
<input type="submit" value="Send enquiry" class="w-button">
</form><div class="w-form-done"><div>Thank you! We'll be in touch.</div></div><div class="w-form-fail"><div>Oops! Something went wrong.</div></div></div>
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1d2541!2d-5.0700!3d50.1530!2m3" title="Map"></iframe>
</div></section>
