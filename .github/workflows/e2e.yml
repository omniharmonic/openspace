name: E2E

# End-to-end suite: the real Hub (wrangler dev, DEV_MODE, local D1/DO/R2) + the real Studio,
# driven by Playwright. Needs no secrets or accounts. Manual and nightly; not a required check.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omniharmonic/openspace-e2e exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
